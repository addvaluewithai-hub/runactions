name: Deploy FableCut editor to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fablecut/**'
      - 'functions/**'
      - 'workers/**'
      - 'editor/media/rooftop-7000/**'
      - 'scripts/build-fablecut-pages.sh'
      - 'scripts/patch_fablecut_preview_playback.py'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-fablecut-cloudflare.yml'

permissions:
  contents: read

concurrency:
  group: deploy-fablecut-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: qserve-video-editor
      PROJECT_NAME: runactions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare credentials
        run: npx --yes wrangler@latest whoami

      - name: Ensure R2 bucket exists
        shell: bash
        run: |
          set -euo pipefail
          if npx --yes wrangler@latest r2 bucket list 2>&1 | tee /tmp/r2-buckets.txt | grep -Fq "$R2_BUCKET"; then
            echo "R2 bucket $R2_BUCKET already exists"
          else
            echo "Creating R2 bucket $R2_BUCKET"
            npx --yes wrangler@latest r2 bucket create "$R2_BUCKET"
          fi

      - name: Seed Rooftop project once
        shell: bash
        run: |
          set -euo pipefail
          KEY="$R2_BUCKET/projects/rooftop-7000/project.json"
          if npx --yes wrangler@latest r2 object get "$KEY" --file=/tmp/rooftop-project.json --remote >/tmp/r2-get.log 2>&1; then
            echo "Rooftop shared project already exists in R2; keeping saved revision"
          else
            echo "Seeding Rooftop shared project into R2"
            npx --yes wrangler@latest r2 object put "$KEY" \
              --file=fablecut/projects/rooftop-7000/project.json \
              --content-type='application/json; charset=utf-8' \
              --remote
          fi

      - name: Prepare Rooftop playback sources
        shell: bash
        run: |
          set -euo pipefail
          cp editor/media/rooftop-7000/presenter_proxy.mp4 /tmp/rooftop-7000-presenter.mp4

          # The tiny repository product proxy is fine for picture preview, but its
          # audio stream is not accepted by Cloudflare Media Transformations. Build
          # one stable low-res H.264/AAC source from the production recording so
          # BOTH short video and short audio proxies can be cut from the same file.
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet gdown
          gdown 1P_hd1WID6X66cem9vmh84DgAYBYSsf37 -O /tmp/rooftop-product-original.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 /tmp/rooftop-product-original.mp4
          ffmpeg -y -hide_banner -loglevel error \
            -i /tmp/rooftop-product-original.mp4 \
            -map 0:v:0 -map 0:a:0 \
            -vf 'scale=360:-2,fps=30,format=yuv420p' \
            -c:v libx264 -preset veryfast -crf 25 -tune fastdecode \
            -g 30 -keyint_min 30 -sc_threshold 0 -bf 0 \
            -c:a aac -b:a 128k -ar 48000 \
            -movflags +faststart \
            /tmp/rooftop-7000-product.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 /tmp/rooftop-7000-product.mp4

      - name: Mirror Rooftop playback sources to R2
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest r2 object put \
            "$R2_BUCKET/sources/rooftop-7000/rooftop-7000-presenter.mp4" \
            --file=/tmp/rooftop-7000-presenter.mp4 \
            --content-type='video/mp4' \
            --remote
          npx --yes wrangler@latest r2 object put \
            "$R2_BUCKET/sources/rooftop-7000/rooftop-7000-product.mp4" \
            --file=/tmp/rooftop-7000-product.mp4 \
            --content-type='video/mp4' \
            --remote

      - name: Deploy playback optimizer worker
        run: npx --yes wrangler@latest deploy -c workers/media-optimizer/wrangler.jsonc

      - name: Build FableCut Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-fablecut-pages.sh
          grep -Fq '__QSERVE_PLAYBACK_PATCH__' dist/app.js
          grep -Fq 'prime-active-av-v1' dist/app.js

      - name: Deploy Pages + Functions + R2 binding
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="QServe FableCut ${GITHUB_SHA::7}"

      - name: Smoke test production editor
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${PROJECT_NAME}.pages.dev"
          for i in {1..12}; do
            if curl -fsS --max-time 20 "$BASE/?project=rooftop-7000" -o /tmp/editor.html \
              && grep -Fq 'FableCut' /tmp/editor.html \
              && curl -fsS --max-time 20 "$BASE/app.js" -o /tmp/app.js \
              && grep -Fq 'prime-active-av-v1' /tmp/app.js \
              && curl -fsS --max-time 20 "$BASE/api/project?project=rooftop-7000" -o /tmp/project.json \
              && python -c "import json; p=json.load(open('/tmp/project.json')); assert p.get('name'); assert isinstance(p.get('clips'), list) and p['clips']; assert isinstance(p.get('media'), list) and p['media']; print('R2 project revision:', p.get('revision'))"; then
              echo "Production editor + playback patch smoke test passed: $BASE/?project=rooftop-7000"
              break
            fi
            if [ "$i" = 12 ]; then
              echo "Production editor smoke test failed" >&2
              exit 1
            fi
            echo "Waiting for production alias... attempt $i/12"
            sleep 5
          done

          curl -fsS --max-time 360 \
            -X POST \
            -H "Origin: $BASE" \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "$BASE/api/optimize?project=rooftop-7000" \
            -o /tmp/optimization.json
          python - <<'PY'
          import json
          project=json.load(open('/tmp/project.json'))
          opt=json.load(open('/tmp/optimization.json'))
          segments=opt.get('segments') or []
          skipped=opt.get('skipped') or []
          disabled=set(project.get('disabledTracks') or [])
          media={str(m.get('id')):m for m in project.get('media') or []}
          expected=[]
          for clip in project.get('clips') or []:
              kind=clip.get('kind')
              if kind not in ('video','audio') or clip.get('track') in disabled:
                  continue
              src=media.get(str(clip.get('mediaId')))
              if not src or src.get('kind') != 'video':
                  continue
              duration=float(clip.get('duration') or 0)
              speed=float((clip.get('props') or {}).get('speed') or 1)
              limit=180 if kind == 'audio' else 55
              if duration > 0 and speed > 0 and duration * speed <= limit:
                  expected.append(str(clip.get('id')))
          actual=[str(s.get('clipId')) for s in segments if s.get('clipId')]
          kinds={str(s.get('clipId')):s.get('proxyKind') for s in segments if s.get('clipId')}
          print('Optimization mode:', opt.get('mode'))
          print('Expected A/V clips:', len(expected), 'optimized:', len(actual), 'skipped:', len(skipped))
          print('Video proxies:', sum(v == 'video' for v in kinds.values()), 'Audio proxies:', sum(v == 'audio' for v in kinds.values()))
          if opt.get('mode') != 'one-proxy-per-av-clip':
              print(json.dumps(opt, indent=2))
              raise SystemExit('Playback optimizer is not in one-proxy-per-av-clip mode')
          if len(actual) != len(set(actual)):
              raise SystemExit('Playback optimizer returned duplicate clip mappings')
          if set(actual) != set(expected) or skipped:
              print('Missing:', sorted(set(expected)-set(actual)))
              print('Unexpected:', sorted(set(actual)-set(expected)))
              print(json.dumps(opt, indent=2))
              raise SystemExit('Playback optimizer did not create exactly one proxy per eligible A/V clip')
          PY
