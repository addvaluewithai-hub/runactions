name: Build QServe editor assets

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Lead project slug
        required: true
        default: rooftop-7000
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, '[build-editor-assets]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve project slug
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLUG: ${{ inputs.slug }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SLUG="$INPUT_SLUG"
          else
            SLUG="$(printf '%s' "$ISSUE_TITLE" | sed -E 's/^.*\[build-editor-assets\][[:space:]]*//')"
          fi
          test -n "$SLUG"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade gdown

      - name: Download project assets
        run: |
          mkdir -p "editor/media/$SLUG" /tmp/editor-src
          python - <<'PY'
          import json, os, pathlib, subprocess

          slug = os.environ['SLUG']
          project = json.load(open(f'editor/projects/{slug}.json'))
          tmp = pathlib.Path('/tmp/editor-src')
          dest = pathlib.Path('editor/media') / slug

          names = {
              'qr': 'qr.jpg',
              'mockup': 'mockup.jpg',
              'dashboardMenu': 'dashboard_menu.jpg',
              'dashboardServices': 'dashboard_services.jpg',
              'dashboardRequests': 'dashboard_requests.jpg',
              'dashboardPerformance': 'dashboard_performance.jpg',
          }

          for key, asset in project['media'].items():
              drive = asset.get('original', {}).get('driveId')
              if not drive:
                  continue
              if asset['type'] == 'video':
                  target = tmp / f'{key}.mp4'
              else:
                  target = dest / names.get(key, f'{key}.jpg')
              target.parent.mkdir(parents=True, exist_ok=True)
              subprocess.check_call(['gdown', drive, '-O', str(target)])
          PY

      - name: Build lightweight browser proxies
        run: |
          ffmpeg -y -i /tmp/editor-src/presenter.mp4 -vf "scale=360:-2" -c:v libx264 -preset veryfast -crf 34 -c:a aac -b:a 64k -movflags +faststart "editor/media/$SLUG/presenter_proxy.mp4"
          ffmpeg -y -i /tmp/editor-src/product.mp4 -vf "scale=360:-2,fps=30" -c:v libx264 -preset veryfast -crf 34 -an -movflags +faststart "editor/media/$SLUG/product_proxy.mp4"

      - name: Verify editor assets
        run: |
          test -s "editor/media/$SLUG/presenter_proxy.mp4"
          test -s "editor/media/$SLUG/product_proxy.mp4"
          test -s "editor/media/$SLUG/qr.jpg"
          test -s "editor/media/$SLUG/mockup.jpg"
          test -s "editor/media/$SLUG/dashboard_menu.jpg"
          test -s "editor/media/$SLUG/dashboard_services.jpg"
          test -s "editor/media/$SLUG/dashboard_requests.jpg"
          test -s "editor/media/$SLUG/dashboard_performance.jpg"
          du -h "editor/media/$SLUG"/*

      - name: Commit generated editor assets
        run: |
          git config user.name "qserve-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "editor/media/$SLUG"
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "Build editor media for $SLUG"
            git push origin HEAD:main
          fi
