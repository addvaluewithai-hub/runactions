name: Build QServe editor assets

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Lead project slug
        required: true
        default: rooftop-7000
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, '[build-editor-assets]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve project slug
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLUG: ${{ inputs.slug }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SLUG="$INPUT_SLUG"
          else
            SLUG="$(printf '%s' "$ISSUE_TITLE" | sed -E 's/^.*\[build-editor-assets\][[:space:]]*//')"
          fi
          test -n "$SLUG"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade gdown

      - name: Download project media
        run: |
          mkdir -p "editor/media/$SLUG" /tmp/editor-src
          python - <<'PY'
          import json, os, subprocess, pathlib
          slug=os.environ['SLUG']
          p=json.load(open(f'editor/projects/{slug}.json'))
          out=pathlib.Path('/tmp/editor-src')
          for key in ('presenter','product','qr','mockup'):
              asset=p['media'][key]
              drive=asset.get('original',{}).get('driveId')
              if not drive: continue
              ext='.mp4' if asset['type']=='video' else '.jpg'
              dest=out/f'{key}{ext}'
              subprocess.check_call(['gdown', drive, '-O', str(dest)])
          PY

      - name: Build lightweight browser proxies
        run: |
          ffmpeg -y -i /tmp/editor-src/presenter.mp4 -vf "scale=360:-2" -c:v libx264 -preset veryfast -crf 34 -c:a aac -b:a 64k -movflags +faststart "editor/media/$SLUG/presenter_proxy.mp4"
          ffmpeg -y -i /tmp/editor-src/product.mp4 -vf "scale=360:-2" -c:v libx264 -preset veryfast -crf 34 -an -movflags +faststart "editor/media/$SLUG/product_proxy.mp4"
          cp /tmp/editor-src/qr.jpg "editor/media/$SLUG/qr.jpg"
          cp /tmp/editor-src/mockup.jpg "editor/media/$SLUG/mockup.jpg"

      - name: Start QServe dashboard for screenshots
        run: |
          git clone --depth 1 https://github.com/addvaluewithai-hub/Qserve.git /tmp/qserve
          cd /tmp/qserve
          npm install
          nohup npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/qserve-vite.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          npx -y playwright@1.55.0 install chromium --with-deps

      - name: Capture dashboard screens
        run: |
          npx -y playwright@1.55.0 screenshot --viewport-size="1440,1000" --full-page "http://127.0.0.1:4173/dashboard/menu?venue=nile-table&lang=en" "editor/media/$SLUG/dashboard_menu.jpg"
          npx -y playwright@1.55.0 screenshot --viewport-size="1440,1000" --full-page "http://127.0.0.1:4173/dashboard/services?venue=nile-table&lang=en" "editor/media/$SLUG/dashboard_services.jpg"
          npx -y playwright@1.55.0 screenshot --viewport-size="1440,1000" --full-page "http://127.0.0.1:4173/dashboard/requests?venue=nile-table&lang=en" "editor/media/$SLUG/dashboard_requests.jpg"
          npx -y playwright@1.55.0 screenshot --viewport-size="1440,1000" --full-page "http://127.0.0.1:4173/dashboard/performance?venue=nile-table&lang=en" "editor/media/$SLUG/dashboard_performance.jpg"

      - name: Commit generated editor assets
        run: |
          git config user.name "qserve-video-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "editor/media/$SLUG"
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "Build editor media for $SLUG"
            git push origin HEAD:main
          fi
