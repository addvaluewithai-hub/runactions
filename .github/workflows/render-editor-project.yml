name: Render editable QServe project

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Project slug in editor/projects
        required: true
        default: rooftop-7000

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade gdown pillow
      - name: Download original lead assets
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          mkdir -p work output
          python - <<'PY'
          import json, os, subprocess
          slug=os.environ['SLUG']; p=json.load(open(f'editor/projects/{slug}.json'))
          names={'presenter':'presenter.mp4','product':'product.mp4','qr':'qr.jpg','mockup':'mockup.jpg'}
          for key,name in names.items():
              drive=p['media'][key].get('original',{}).get('driveId')
              if not drive: raise SystemExit(f'Missing Drive id for {key}')
              subprocess.check_call(['gdown','--id',drive,'-O',f'work/{name}'])
          PY
      - name: Render timeline
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          python factory/render_editor_project.py --project "editor/projects/$SLUG.json" --work work --out "output/$SLUG.mp4"
      - name: QA output
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          python factory/qa_video.py "output/$SLUG.mp4" --expected-duration 99.733 --out "output/qa.json"
      - name: Upload render
        uses: actions/upload-artifact@v4
        with:
          name: editor-render-${{ inputs.slug }}
          path: output/
          retention-days: 30
